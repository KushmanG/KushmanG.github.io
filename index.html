<!--
  My portfolio, file map (pipeline order, same as my Python projects):
  1. index.html    → page skeleton + all the styling. I rarely touch this.
  2. a_content.js  → EVERY word, link, project, achievement. THE file I edit.
  3. b_render.js   → reads a_content.js and builds the sections.
  4. c_plasma.js   → the live Yukawa crystal behind my name.
  Palette = my plot palette (blue #2a78d6, orange #d6642a, ref grey #898781) so the site looks like my figures.
-->
<style>
  :root {
    --bg: #0e0e0d;
    --bg-raise: #1b1b19;
    --card: #151513;
    --line: #262522;
    --line-strong: #3a3832;
    --text: #ecebe6;
    --text-2: #cbc9c2;
    --muted: #9a9891;
    --dim: #84827b;
    --orange: #d6642a;
    --blue: #2a78d6;
    --blue-text: #6ea8ee;
    --serif: "Instrument Serif", Georgia, "Times New Roman", serif;
    --sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
    --gutter: clamp(16px, 4vw, 48px);
    --maxw: 1120px;
    --radius: 14px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; scroll-padding-top: 64px; background: var(--bg); }
  @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
  body { background: var(--bg); color: var(--text); font-family: var(--sans); font-size: 16px; line-height: 1.55; -webkit-font-smoothing: antialiased; }
  a { color: inherit; }
  ::selection { background: var(--orange); color: var(--bg); }
  :focus-visible { outline: 2px solid var(--orange); outline-offset: 3px; border-radius: 6px; }
  strong { font-weight: 600; color: var(--text); }
  em { font-style: italic; color: var(--orange); }

  /* ---------- Nav ---------- */
  .nav { position: fixed; top: 0; left: 0; right: 0; z-index: 50; display: flex; align-items: center; justify-content: space-between; gap: 20px;
    padding: 18px var(--gutter); font-family: var(--mono); font-size: 13px; border-bottom: 1px solid transparent; transition: background .25s, border-color .25s, padding .25s; }
  .nav.solid { background: rgba(14,14,13,0.84); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-bottom-color: var(--line); padding-top: 12px; padding-bottom: 12px; }
  .nav .mark { text-decoration: none; letter-spacing: .04em; white-space: nowrap; }
  .nav .links { display: flex; gap: clamp(14px, 2vw, 26px); min-width: 0; overflow-x: auto; scrollbar-width: none; }
  .nav .links::-webkit-scrollbar { display: none; }
  .nav .links a { color: var(--muted); text-decoration: none; white-space: nowrap; transition: color .2s; }
  .nav .links a:hover, .nav .links a.active { color: var(--text); }
  .nav .links a.active::before { content: ""; display: inline-block; width: 5px; height: 5px; border-radius: 50%; background: var(--orange); margin-right: 7px; vertical-align: middle; transform: translateY(-1px); }

  /* ---------- Hero ---------- */
  .hero { position: relative; height: 94svh; min-height: 600px; max-height: 1000px; overflow: hidden; border-bottom: 1px solid var(--line); }
  #plasma { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .hero-shade { position: absolute; inset: 0; pointer-events: none;
    background:
      radial-gradient(110% 85% at 0% 100%, rgba(14,14,13,0.94) 0%, rgba(14,14,13,0.6) 42%, rgba(14,14,13,0) 72%),
      linear-gradient(180deg, rgba(14,14,13,0.7) 0%, rgba(14,14,13,0) 20%, rgba(14,14,13,0) 72%, rgba(14,14,13,0.9) 100%); }
  .hero-inner { position: absolute; left: var(--gutter); right: var(--gutter); bottom: clamp(36px, 8vh, 92px); max-width: 760px; pointer-events: none; }
  .hero-inner a { pointer-events: auto; }
  .eyebrow { font-family: var(--mono); font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--orange); }
  .hero h1 { font-family: var(--serif); font-weight: 400; font-size: clamp(60px, 10.5vw, 136px); line-height: .9; letter-spacing: -0.015em; margin-top: 14px; }
  .hero h1 em { color: var(--muted); }
  .interests { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 24px; }
  .interest { display: inline-flex; align-items: center; gap: 9px; font-family: var(--mono); font-size: 13px; letter-spacing: .03em; padding: 7px 14px; border-radius: 99px;
    border: 1px solid var(--line-strong); background: rgba(21,21,19,0.72); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
  .interest i { width: 7px; height: 7px; border-radius: 50%; background: var(--orange); }
  .interest i.c1 { background: var(--blue); }
  .tagline { margin-top: 18px; font-size: clamp(16px, 1.5vw, 19px); color: var(--text-2); max-width: 600px; }
  .hero-links { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 26px; }
  .btn { display: inline-flex; align-items: center; gap: 7px; font-family: var(--mono); font-size: 13px; text-decoration: none; color: var(--text); padding: 9px 16px; border-radius: 8px;
    border: 1px solid var(--line-strong); background: rgba(21,21,19,0.72); transition: border-color .2s, background .2s; }
  .btn:hover { border-color: var(--orange); }
  .btn.primary { background: var(--text); color: var(--bg); border-color: var(--text); }
  .btn.primary:hover { background: #fff; border-color: #fff; }
  .hero-caption { position: absolute; right: var(--gutter); bottom: 22px; font-family: var(--mono); font-size: 11px; color: var(--dim); pointer-events: none; }

  /* ---------- Sections ---------- */
  main { max-width: var(--maxw); margin: 0 auto; padding: 0 var(--gutter); }
  .section { padding: clamp(44px, 6vw, 76px) 0; border-bottom: 1px solid var(--line); }
  .section:last-child { border-bottom: 0; }
  .sec-head { display: flex; align-items: baseline; gap: 16px; margin-bottom: 26px; }
  .sec-num { font-family: var(--mono); font-size: 12px; color: var(--orange); letter-spacing: .1em; }
  .sec-head h2 { font-family: var(--serif); font-weight: 400; font-size: clamp(34px, 4.4vw, 50px); line-height: 1; }

  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: clamp(20px, 2.4vw, 28px); }
  .card-top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px 14px; flex-wrap: wrap; }
  .card h3 { font-size: 18px; font-weight: 600; line-height: 1.3; }
  .card .where { color: var(--text-2); font-size: 14.5px; margin-top: 4px; }
  .card .place { color: var(--muted); font-size: 13.5px; margin-top: 2px; }
  .date { font-family: var(--mono); font-size: 12px; color: var(--muted); white-space: nowrap; }
  .cat { font-family: var(--mono); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--blue-text); }
  .serif-title { font-family: var(--serif); font-weight: 400 !important; line-height: 1.1 !important; margin-top: 14px; }
  .mini-label { font-family: var(--mono); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--dim); margin-top: 18px; }
  .col-label { font-family: var(--mono); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--dim); margin-bottom: 12px; }

  ul.points { list-style: none; margin-top: 16px; display: grid; gap: 9px; }
  ul.points li { position: relative; padding-left: 20px; color: var(--text-2); font-size: 15px; line-height: 1.5; }
  ul.points li::before { content: ""; position: absolute; left: 3px; top: .6em; width: 6px; height: 6px; border-radius: 1px; background: var(--orange); transform: rotate(45deg); }

  .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 16px; }
  .tags span { font-family: var(--mono); font-size: 11.5px; color: var(--muted); border: 1px solid var(--line-strong); border-radius: 99px; padding: 3px 10px; }
  .mini-label + .tags { margin-top: 10px; }

  .pill { display: inline-flex; align-items: center; gap: 7px; font-family: var(--mono); font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; padding: 4px 10px; border-radius: 99px; border: 1px solid var(--line-strong); color: var(--muted); white-space: nowrap; }
  .pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .pill.s-active { color: var(--orange); border-color: rgba(214,100,42,.45); }
  .pill.s-done { color: var(--blue-text); border-color: rgba(42,120,214,.5); }
  .pill.s-idea { border-style: dashed; }

  .card-links { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 20px; }
  .link-btn { display: inline-flex; align-items: center; gap: 6px; font-family: var(--mono); font-size: 12.5px; color: var(--text); text-decoration: none; padding: 7px 12px; border: 1px solid var(--line-strong); border-radius: 8px; transition: border-color .2s, color .2s; }
  .link-btn:hover { border-color: var(--orange); color: var(--orange); }

  /* Experience & Education */
  .xp-grid { display: grid; grid-template-columns: 1.3fr 1fr; gap: 20px; align-items: start; }
  .xp-grid.single { grid-template-columns: 1fr; }
  .stack-v { display: grid; gap: 16px; }

  /* Research */
  .research-list { display: grid; gap: 20px; }
  .rcard { display: grid; grid-template-columns: 1.25fr 1fr; gap: clamp(22px, 3.5vw, 48px); }
  .rcard.compact { grid-template-columns: 1fr; }
  .rcard.compact ul.points { max-width: 780px; }
  .rcard .serif-title { font-size: clamp(26px, 2.8vw, 34px); }
  .r-side { border-left: 1px solid var(--line); padding-left: clamp(22px, 3.5vw, 48px); }
  .r-side .mini-label:first-child { margin-top: 2px; }
  ol.pipeline { list-style: none; margin-top: 14px; }
  .pipe-step { display: grid; grid-template-columns: 30px 1fr; gap: 14px; position: relative; padding-bottom: 14px; }
  .pipe-step:last-child { padding-bottom: 0; }
  .pipe-step .dot { width: 30px; height: 30px; border-radius: 50%; border: 1px solid var(--line-strong); display: grid; place-items: center; font-family: var(--mono); font-size: 12px; color: var(--muted); background: var(--card); position: relative; z-index: 1; }
  .pipe-step:last-child .dot { border-color: var(--orange); color: var(--orange); }
  .pipe-step:not(:last-child)::after { content: ""; position: absolute; left: 15px; top: 30px; bottom: 0; width: 1px; background: var(--line-strong); }
  .pipe-step .t { font-weight: 600; font-size: 15px; line-height: 1.3; margin-top: 5px; }
  .pipe-step .s { color: var(--muted); font-size: 13.5px; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; margin-top: 22px; }
  .stat { background: var(--bg); padding: 14px 12px; }
  .stat .v { font-family: var(--sans); font-weight: 500; font-size: 24px; letter-spacing: -0.01em; line-height: 1.1; white-space: nowrap; }   /* sans here: the serif's "1" reads like an "l" */
  .stat .l { font-family: var(--mono); font-size: 11px; color: var(--muted); margin-top: 7px; line-height: 1.4; }

  /* Projects */
  .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
  .pcard { display: flex; flex-direction: column; transition: border-color .25s, transform .25s; }
  .pcard:hover { border-color: var(--line-strong); transform: translateY(-2px); }
  .pcard .serif-title { font-size: 30px; }
  .pcard .grow { flex: 1; }

  /* Achievements */
  .ach-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 14px; }
  .ach { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 22px 20px; }
  .ach .metric { font-family: var(--serif); font-size: clamp(34px, 3.6vw, 44px); line-height: 1; }
  .ach .ach-title { font-weight: 600; font-size: 15px; line-height: 1.3; margin-top: 14px; }
  .ach .ach-detail { color: var(--muted); font-size: 13.5px; margin-top: 5px; }

  /* Skills */
  .skills { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
  .skill-group h4 { font-family: var(--mono); font-size: 11.5px; font-weight: 500; letter-spacing: .12em; text-transform: uppercase; color: var(--blue-text); }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
  .chips span { font-size: 14px; padding: 6px 12px; border-radius: 8px; background: var(--bg-raise); border: 1px solid var(--line); color: var(--text-2); }

  /* Contact */
  .contact-head { font-family: var(--serif); font-size: clamp(36px, 5.6vw, 68px); line-height: 1.04; max-width: 900px; }
  .contact-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; margin-top: 34px; }
  .contact-item { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 16px 18px; border: 1px solid var(--line); border-radius: 12px; background: var(--card); text-decoration: none; color: var(--text); transition: border-color .2s; min-width: 0; }
  a.contact-item:hover { border-color: var(--orange); }
  .contact-item > div { min-width: 0; }
  .contact-item .k { font-family: var(--mono); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
  .contact-item .v { font-size: 15px; margin-top: 3px; overflow-wrap: anywhere; }
  .contact-item .arrow { color: var(--muted); transition: color .2s, transform .2s; }
  a.contact-item:hover .arrow { color: var(--orange); transform: translateX(3px); }

  .footer { max-width: var(--maxw); margin: 0 auto; padding: 26px var(--gutter) 40px; display: flex; justify-content: space-between; flex-wrap: wrap; gap: 10px 20px; font-family: var(--mono); font-size: 12px; color: var(--dim); }

  /* content-file problems (see b_render.js) */
  .broken { margin: 64px 0; padding: 20px 22px; border: 1px solid var(--orange); border-radius: 12px; color: var(--text-2); }
  .warn { position: fixed; right: 16px; bottom: 16px; z-index: 99; max-width: 360px; padding: 14px 16px; background: #2a1209; border: 1px solid var(--orange); border-radius: 10px; font-family: var(--mono); font-size: 12px; line-height: 1.6; color: var(--text); }

  /* ---------- Responsive ---------- */
  @media (max-width: 980px) {
    .grid-3 { grid-template-columns: repeat(2, 1fr); }
    .rcard, .xp-grid { grid-template-columns: 1fr; }
    .r-side { border-left: 0; padding-left: 0; border-top: 1px solid var(--line); padding-top: 22px; }
  }
  @media (max-width: 680px) {
    .nav { gap: 14px; }
    .nav .links { -webkit-mask-image: linear-gradient(90deg, #000 82%, transparent); mask-image: linear-gradient(90deg, #000 82%, transparent); padding-right: 24px; }
    .grid-3, .skills { grid-template-columns: 1fr; }
    .ach-grid { grid-template-columns: repeat(2, 1fr); }
    .hero-caption { display: none; }
    .hero-shade { background:
      linear-gradient(180deg, rgba(14,14,13,0.7) 0%, rgba(14,14,13,0) 18%, rgba(14,14,13,0.35) 42%, rgba(14,14,13,0.94) 78%); }
    .stat .v { font-size: 20px; }
    .card { padding: 18px; }
    ul.points li { font-size: 14.5px; }
    .chips { gap: 6px; }
    .chips span { font-size: 13px; padding: 5px 10px; }
    .ach { padding: 18px 16px; }
  }
</style>
</head>
<body>

<nav class="nav" id="nav" aria-label="Sections">
  <a class="mark" id="navMark" href="#top">kushman.goyal</a>
  <div class="links" id="navLinks"></div>
</nav>

<header class="hero" id="top">
  <canvas id="plasma" aria-hidden="true"></canvas>
  <div class="hero-shade"></div>
  <div class="hero-inner" id="hero"></div>
  <div class="hero-caption" id="heroCaption"></div>
</header>

<main id="main">
  <noscript><div class="broken">This site builds itself with JavaScript. Please enable it to see the content.</div></noscript>
</main>

<footer class="footer" id="footer"></footer>

<script src="a_content.js"></script>
<script src="b_render.js"></script>
<script src="c_plasma.js"></script>
</body>
</html>
